⏳ Étape 2 : enregistrement SW...");

⏳ Étape 3 : getToken...");

⏳ Étape 4 : sauvegarde Firestore...");

// Firebase est init synchrone dans le <head>.
function waitForFirebase() { return Promise.resolve(); }

// Appel sécurisé : vérifie que la fn existe avant d'appeler
function fbCall(fnName, ...args) {
  if (typeof window[fnName] !== "function") {
    // Firebase CDN n'a pas encore chargé → réessayer dans 200ms, max 10s
    return new Promise(function(resolve, reject) {
      var tries = 0;
      var t = setInterval(function() {
        tries++;
        if (typeof window[fnName] === "function") {
          clearInterval(t);
          resolve(window[fnName](...args));
        } else if (tries > 50) {
          clearInterval(t);
          reject(new Error("Firebase non disponible. Vérifie ta connexion et recharge la page."));
        }
      }, 200);
    });
  }
  return Promise.resolve(window[fnName](...args));
}

function fileToBase64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
}

function saveVisit(user) {

function fmtVisit(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  const now = new Date();
  const diffMs = now - d;
  const diffMin = Math.floor(diffMs / 60000);
  if (diffMin < 2) return "à l'instant";
  if (diffMin < 60) return `il y a ${diffMin} min`;
  const diffH = Math.floor(diffMin / 60);
  if (diffH < 24) return `il y a ${diffH}h`;
  const diffD = Math.floor(diffH / 24);
  return `il y a ${diffD}j`;
}

function useTimer() {
  const [t, setT] = useState({ days:0, hours:0, minutes:0, seconds:0 });
  useEffect(() => {
    const tick = () => {
      const ms = Math.max(0, Date.now() - START_DATE.getTime());
      setT({ days:Math.floor(ms/86400000), hours:Math.floor(ms/3600000)%24, minutes:Math.floor(ms/60000)%60, seconds:Math.floor(ms/1000)%60 });
    };
    tick(); const id = setInterval(tick, 1000); return () => clearInterval(id);
  }, []);
  return t;
}

function getAnniversaries() {
  const end = new Date(); end.setHours(23,59,59,999);
  const list = []; let n = 1;
  while (list.length < 6 && n < 300) {
    const d = new Date(START_DATE); d.setMonth(START_DATE.getMonth()+n);
    if (d > end) list.push({ num:n, date:d }); n++;
  }
  return list;
}
function getProgress(ann) {
  const prev = new Date(START_DATE); prev.setMonth(START_DATE.getMonth()+ann.num-1);
  return +(Math.min(100,Math.max(0,((Date.now()-prev.getTime())/(ann.date.getTime()-prev.getTime()))*100)).toFixed(1));
}

  const [counts, setCounts] = useState({count_boeuf:0, count_poulet:0});

function parseLocalDate(str) {
  if (!str) return new Date(0);
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
    const [y,mo,d] = str.split("-").map(Number);
    return new Date(y, mo-1, d, 0, 0, 0, 0);
  }
  return new Date(str);
}

function HomeCapsuleCard({msg}) {
  const unlockTs = parseLocalDate(msg.unlockDate).getTime();
  const [now, setNow] = useState(Date.now());

  useEffect(() => {
    if (Date.now() >= unlockTs) return;
    const id = setInterval(() => {
      const n = Date.now();
      setNow(n);
      if (n >= unlockTs) clearInterval(id);
    }, 1000);
    return () => clearInterval(id);
  }, [unlockTs]);

  const unlocked = now >= unlockTs;
  const diffMs = Math.max(0, unlockTs - now);
  const cntD = Math.floor(diffMs/86400000);
  const cntH = Math.floor(diffMs/3600000)%24;
  const cntM = Math.floor(diffMs/60000)%60;
  const cntS = Math.floor(diffMs/1000)%60;
  const authorLabel = msg.author === "lui" ? "De Lui 💙" : "D'Elle 🌸";
  const fmt = ts => new Date(ts).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});

  return (
    <div style={{background:"rgba(13,27,42,.8)",border:`1px solid ${unlocked?"rgba(96,165,250,.3)":"rgba(30,58,95,.4)"}`,borderRadius:12,padding:"20px",position:"relative",transition:"border-color .6s"}}>
      <div className="corner-bracket tl"/><div className="corner-bracket br"/>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:18}}>{unlocked?"💌":"🔒"}</span>
          <div>
            <div style={{fontFamily:"'Outfit',sans-serif",fontSize:10,letterSpacing:2,textTransform:"uppercase",color:msg.author==="lui"?"#3b82f6":"#f472b6"}}>{authorLabel}</div>
            <div style={{fontFamily:"'Outfit',sans-serif",fontSize:10,color:"#334155"}}>{unlocked?`Débloqué le ${fmt(unlockTs)}`:`Se dévoile le ${fmt(unlockTs)}`}</div>
          </div>
        </div>
        {unlocked
          ? <span style={{fontFamily:"'Space Mono',monospace",fontSize:10,color:"#22c55e",letterSpacing:1}}>✓ OUVERT</span>
          : <span style={{fontFamily:"'Space Mono',monospace",fontSize:11,color:"#334155",letterSpacing:1}}>
              {cntD>0&&`${cntD}j `}{String(cntH).padStart(2,"0")}:{String(cntM).padStart(2,"0")}:{String(cntS).padStart(2,"0")}
            </span>
        }
      </div>
      <div style={{position:"relative",borderRadius:8,overflow:"hidden"}}>
        <p style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:16,lineHeight:1.8,color:"#cbd5e1",padding:"14px 18px",background:"rgba(8,20,35,.6)",borderRadius:8,border:"1px solid rgba(30,58,95,.3)",margin:0,filter:unlocked?"none":"blur(12px)",userSelect:unlocked?"auto":"none",pointerEvents:unlocked?"auto":"none",transition:"filter .8s ease",minHeight:52}}>{msg.text}</p>
        {!unlocked&&(
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",borderRadius:8,pointerEvents:"none"}}>
            <div style={{fontSize:26,marginBottom:4}}>🔒</div>
            <span style={{fontFamily:"'Outfit',sans-serif",fontSize:11,color:"#475569",letterSpacing:2}}>Message scellé</span>
          </div>
        )}
      </div>
    </div>
  );
}

function FlashbackBlock() {
  const [photos, setPhotos] = useState([]);
  const [current, setCurrent] = useState(null);
  const [animKey, setAnimKey] = useState(0);
  const [loaded, setLoaded] = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const photosRef = useRef([]);
  const intervalRef = useRef(null);

  const pickRandom = (list) => list[Math.floor(Math.random() * list.length)];

  const showRandom = useCallback(() => {
    const pool = photosRef.current;
    if (!pool.length) return;
    setCurrent(pickRandom(pool));
    setAnimKey(k => k + 1);
  }, []);

  // Random interval between 10 and 15 seconds
  const scheduleNext = useCallback(() => {
    clearInterval(intervalRef.current);
    const delay = 10000 + Math.random() * 5000;
    intervalRef.current = setTimeout(() => {
      showRandom();
      scheduleNext();
    }, delay);
  }, [showRandom]);

  useEffect(() => {
    waitForFirebase().then(async () => {
      try {
        const data = await fbCall('fbGetPhotos');
        photosRef.current = data;
        setPhotos(data);
        setLoaded(true);
        if (data.length) {
          const first = pickRandom(data);
          setCurrent(first);
          setAnimKey(1);
          scheduleNext();
        }
      } catch(e) { setLoaded(true); }
    });
    return () => clearTimeout(intervalRef.current);
  }, [scheduleNext]);

  const handleClick = () => {
    if (current) setLightbox(current);
  };

  if (!loaded) return null;

  return (
    <div className="fade-up-d2" style={{marginBottom:48}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>

          <div className="corner-bracket bl"/><div className="corner-bracket br"/>
          <div style={{fontSize:36,marginBottom:16,opacity:.3}}>🖼️</div>
          <p style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:18,color:"#334155",lineHeight:1.7}}>

function AlbumPage({isAdmin}) {
  const [photos,setPhotos]=useState([]);
  const [loading,setLoading]=useState(true);
  const [uploading,setUploading]=useState(false);
  const [lightbox,setLightbox]=useState(null);
  const [caption,setCaption]=useState("");
  const [error,setError]=useState("");
  const [showForm,setShowForm]=useState(false);
  const [pendingFile,setPendingFile]=useState(null);
  const [uploadProgress,setUploadProgress]=useState("");
  const fileRef=useRef();

  const loadPhotos=useCallback(async()=>{
    setLoading(true);
    setError("");
    try{
      await waitForFirebase();
      const data=await fbCall('fbGetPhotos');
      setPhotos(data);
    } catch(e){
      console.error("Photos Firebase error:",e);
      setError("Impossible de charger les photos : "+(e.message||"erreur réseau"));
    }
    setLoading(false);
  },[]);
  useEffect(()=>{loadPhotos();},[loadPhotos]);

  const handleFileSelect=(e)=>{
    const file=e.target.files?.[0];
    if(!file)return;
    if(!file.type.startsWith("image/")){setError("Veuillez sélectionner une image.");return;}
    setPendingFile(file);setShowForm(true);setError("");
  };

  const handleUpload=async()=>{
    if(!pendingFile)return;
    setUploading(true);setError("");setUploadProgress("Préparation…");
    try{
      await waitForFirebase();
      setUploadProgress("Lecture du fichier…");
      const base64=await fileToBase64(pendingFile);
      const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      setUploadProgress("Envoi vers Firebase…");
      const date=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
      const url=await fbCall('fbUploadPhoto', id,base64,caption.trim(),date);
      setPhotos(prev=>[{id,url,caption:caption.trim(),date},...prev]);
      setCaption("");setPendingFile(null);setShowForm(false);
    }catch(e){setError("Erreur : "+(e.message||"image trop lourde ?"));}
    setUploading(false);setUploadProgress("");
    if(fileRef.current)fileRef.current.value="";
  };

  const handleDelete=async(photo)=>{
    await waitForFirebase();
    await fbCall('fbDeletePhoto', photo.id);
    setPhotos(prev=>prev.filter(p=>p.id!==photo.id));
  };

  return (
    <div style={{position:"relative",zIndex:1,padding:"60px 24px 80px",maxWidth:1100,margin:"0 auto"}}>
      <div className="fade-up" style={{textAlign:"center",marginBottom:48}}>
        <span style={{color:"#1e3a5f",fontFamily:"'Space Mono',monospace",fontSize:11,letterSpacing:4}}>◆ — NOTRE ALBUM — ◆</span>
        <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"clamp(36px,5vw,60px)",fontWeight:300,color:"#e2e8f0",marginTop:8}}>Nos Souvenirs</h2>
        <div style={{display:"flex",alignItems:"center",gap:12,marginTop:16}}>
          <div style={{flex:1,height:1,background:"linear-gradient(to right,transparent,#1e3a5f)"}}/>
          <span style={{color:"#1e3a5f",fontSize:10}}>♡</span>
          <div style={{flex:1,height:1,background:"linear-gradient(to left,transparent,#1e3a5f)"}}/>
        </div>
      </div>
      {isAdmin&&(
        <div className="fade-up-d1" style={{marginBottom:40}}>
          {!showForm?(
            <div onClick={()=>fileRef.current?.click()} style={{border:"2px dashed #1e3a5f",borderRadius:12,padding:"32px",textAlign:"center",cursor:"pointer",transition:"all .3s",background:"rgba(13,27,42,.3)"}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor="#3b82f6";e.currentTarget.style.background="rgba(29,78,216,.05)";}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor="#1e3a5f";e.currentTarget.style.background="rgba(13,27,42,.3)";}}
            >
              <div style={{fontSize:32,marginBottom:10}}>📷</div>
              <p style={{fontFamily:"'Outfit',sans-serif",color:"#475569",fontSize:14,letterSpacing:1}}>Cliquez pour ajouter une photo</p>
              <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleFileSelect}/>
            </div>
          ):(
            <div style={{background:"rgba(13,27,42,.8)",border:"1px solid #1e3a5f",borderRadius:12,padding:"24px"}}>
              <p style={{fontFamily:"'Outfit',sans-serif",color:"#94a3b8",fontSize:13,marginBottom:12}}>📎 {pendingFile?.name}</p>
              <input type="text" placeholder="Légende (optionnel)" value={caption} onChange={e=>setCaption(e.target.value)} style={{marginBottom:12}}/>
              {error&&<p style={{color:"#f87171",fontSize:13,marginBottom:12,fontFamily:"'Outfit',sans-serif"}}>{error}</p>}
              {uploading&&<div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}><div style={{width:16,height:16,border:"2px solid #1e3a5f",borderTopColor:"#3b82f6",borderRadius:"50%",animation:"spin .8s linear infinite"}}/><span style={{fontFamily:"'Outfit',sans-serif",fontSize:12,color:"#475569"}}>{uploadProgress}</span></div>}
              <div style={{display:"flex",gap:10}}>
                <button className="btn-primary" onClick={handleUpload} disabled={uploading}>{uploading?"Envoi…":"Ajouter la photo"}</button>
                <button className="btn-ghost" onClick={()=>{setShowForm(false);setPendingFile(null);setCaption("");setUploading(false);setUploadProgress("");setError("");}}>Annuler</button>
              </div>
            </div>
          )}
        </div>
      )}
      {!loading&&photos.length>0&&<div style={{marginBottom:24,display:"flex",alignItems:"center",gap:10}}><span style={{fontFamily:"'Space Mono',monospace",color:"#1d4ed8",fontSize:12}}>{photos.length} photo{photos.length>1?"s":""}</span><div style={{flex:1,height:1,background:"#0f2a4a"}}/></div>}
      {loading&&<div style={{textAlign:"center",padding:"60px 0"}}><div style={{width:32,height:32,border:"2px solid #1e3a5f",borderTopColor:"#3b82f6",borderRadius:"50%",margin:"0 auto",animation:"spin .8s linear infinite"}}/><p style={{marginTop:16,color:"#334155",fontFamily:"'Outfit',sans-serif",fontSize:13}}>Chargement depuis Firebase…</p></div>}
      {!loading&&error&&<div style={{textAlign:"center",padding:"40px 0"}}><p style={{fontFamily:"'Outfit',sans-serif",fontSize:13,color:"#f87171",marginBottom:16}}>{error}</p><button className="btn-ghost" onClick={loadPhotos}>Réessayer</button></div>}
      {!loading&&!error&&photos.length===0&&<div style={{textAlign:"center",padding:"80px 0"}}><div style={{fontSize:48,marginBottom:16,opacity:.3}}>🖼️</div><p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:22,color:"#334155",fontStyle:"italic"}}>{isAdmin?"Aucune photo encore — ajoutez vos premiers souvenirs ♡":"L'album se remplit bientôt…"}</p></div>}
      {!loading&&photos.length>0&&(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:16}}>
          {photos.map((photo,i)=>(
            <div key={photo.id} className="photo-card fade-up" style={{animationDelay:`${i*.05}s`}} onClick={()=>setLightbox(photo)}>
              <img src={photo.url} alt={photo.caption||"souvenir"} loading="lazy"/>
              <div className="overlay">
                <div style={{flex:1}}>
                  {photo.caption&&<p style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:14,color:"#e2e8f0",marginBottom:4}}>{photo.caption}</p>}
                  <p style={{fontFamily:"'Outfit',sans-serif",fontSize:10,color:"#475569",letterSpacing:1}}>{photo.date}</p>
                </div>
                {isAdmin&&<button className="btn-danger" onClick={e=>{e.stopPropagation();handleDelete(photo);}}>✕</button>}
              </div>
            </div>
          ))}
        </div>
      )}
      {lightbox&&(
        <div className="lightbox" onClick={()=>setLightbox(null)}>
          <div style={{position:"relative"}}>
            <img src={lightbox.url} alt={lightbox.caption} onClick={e=>e.stopPropagation()}/>
            {lightbox.caption&&<div style={{textAlign:"center",marginTop:16,fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:18,color:"#94a3b8"}}>{lightbox.caption}</div>}
            <button onClick={()=>setLightbox(null)} style={{position:"absolute",top:-12,right:-12,background:"#0d1b2a",border:"1px solid #1e3a5f",color:"#94a3b8",width:32,height:32,borderRadius:"50%",cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
          </div>
        </div>
      )}
    </div>
  );
}

function SiteGate({onUnlock}) {
  const [pass,setPass]=useState("");const [err,setErr]=useState(false);const [shake,setShake]=useState(false);
  const submit=()=>{
    const p=pass.toLowerCase().trim();
    if(p===PASS_LUI){onUnlock("lui");}
    else if(p===PASS_ELLE){onUnlock("elle");}
    else{setErr(true);setShake(true);setTimeout(()=>setShake(false),500);}
  };
  return (
    <div style={{minHeight:"100vh",background:"#020c1b",display:"flex",alignItems:"center",justifyContent:"center",position:"relative",overflow:"hidden"}}>
      <G/><BgDecor/>
      {["10%","85%","50%","25%","70%"].map((left,i)=>(
        <div key={i} style={{position:"absolute",left,top:`${15+i*18}%`,fontSize:[14,10,18,12,8][i],color:"#1e3a5f",opacity:.5,animation:`float ${3+i}s ease-in-out infinite`,animationDelay:`${i*.6}s`,userSelect:"none",pointerEvents:"none"}}>♡</div>
      ))}
      <div style={{position:"relative",zIndex:1,width:"min(400px,90vw)",animation:shake?"shakeX .5s ease":"fadeUp .6s ease both"}}>
        <div style={{background:"linear-gradient(160deg,#0d1b2a,#081423)",border:`1px solid ${err?"rgba(239,68,68,.4)":"#1e3a5f"}`,borderRadius:16,padding:"48px 40px",boxShadow:err?"0 0 40px rgba(239,68,68,.1)":"0 0 60px rgba(29,78,216,.12)",transition:"border-color .3s,box-shadow .3s",position:"relative"}}>
          <div className="corner-bracket tl"/><div className="corner-bracket tr"/><div className="corner-bracket bl"/><div className="corner-bracket br"/>
          <div style={{textAlign:"center",marginBottom:24}}><div className="float-anim" style={{fontSize:40,filter:"drop-shadow(0 0 12px rgba(96,165,250,.4))"}}>💙</div></div>
          <h1 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:32,fontWeight:300,color:"#e2e8f0",textAlign:"center",marginBottom:6,letterSpacing:-.5}}>Notre Histoire</h1>
          <p style={{fontFamily:"'Outfit',sans-serif",fontSize:11,letterSpacing:3,textTransform:"uppercase",color:"#334155",textAlign:"center",marginBottom:36}}>Espace privé · A &amp; N</p>
          <label style={{fontFamily:"'Outfit',sans-serif",fontSize:11,letterSpacing:2,textTransform:"uppercase",color:"#475569",display:"block",marginBottom:8}}>Mot de passe</label>
          <input type="password" value={pass} onChange={e=>{setPass(e.target.value);setErr(false);}} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="••••••••" autoFocus style={{marginBottom:6,borderColor:err?"rgba(239,68,68,.5)":undefined}}/>
          <div style={{height:22,marginBottom:14}}>{err&&<p style={{fontFamily:"'Outfit',sans-serif",fontSize:12,color:"#f87171"}}>Mot de passe incorrect ✕</p>}</div>
          <button className="btn-primary" onClick={submit} style={{width:"100%",padding:"13px",fontSize:12,letterSpacing:2}}>Entrer ♡</button>
          <p style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:13,color:"#1e3a5f",textAlign:"center",marginTop:20}}>Réservé à nous deux — 21.03.2025</p>
        </div>
      </div>
    </div>
  );
}

function App() {

  const [page,setPage]=useState("home");
  const [lastVisit,setLastVisit]=useState(null);
  const isAdmin = user==="lui";

  const handleUnlock = (profile) => {
    const prev = getLastVisit(profile);
    setLastVisit(prev);
    saveVisit(profile);
    setUser(profile);
    // Demande la permission de notifications et enregistre le token FCM
    if (typeof window.fbInitMessaging === "function") {
      window.fbInitMessaging(profile);
    }
  };

  if(!user)return <SiteGate onUnlock={handleUnlock}/>;

  const meta = USER_META[user];

  return (
    <div style={{minHeight:"100vh",background:"#020c1b",position:"relative"}}>

          <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:18,color:"#93c5fd",letterSpacing:2}}>Notre Histoire</span>
        </div>

          <span className={`nav-link ${page==="home"?"active":""}`} onClick={()=>setPage("home")}>Accueil</span>

          <span className={`nav-link ${page==="capsule"?"active":""}`} onClick={()=>setPage("capsule")}>Capsule ✦</span>
          {/* User badge */}
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:1,borderLeft:"1px solid rgba(30,58,95,.5)",paddingLeft:16}}>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontSize:13}}>{meta.emoji}</span>
              <span style={{fontFamily:"'Outfit',sans-serif",fontSize:11,letterSpacing:2,color:isAdmin?"#60a5fa":"#f9a8d4",fontWeight:500}}>{meta.label}{isAdmin?" · Admin":""}</span>
            </div>
            {lastVisit && (
              <span style={{fontFamily:"'Space Mono',monospace",fontSize:9,color:"#334155",letterSpacing:1}}>dernière visite {fmtVisit(lastVisit)}</span>
            )}
          </div>
        </div>
      </nav>
      {page==="home"&&<HomePage isAdmin={isAdmin} user={user}/>}
      {page==="album"&&<AlbumPage isAdmin={isAdmin}/>}
      {page==="capsule"&&<CapsulePage user={user}/>}
      <footer style={{borderTop:"1px solid rgba(30,58,95,.3)",padding:"20px 32px",display:"flex",alignItems:"center",justifyContent:"center",gap:20,position:"relative",zIndex:1}}>
        <div style={{flex:1,height:1,background:"linear-gradient(to right,transparent,#0f2a4a)"}}/>
        <span style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",color:"#1e3a5f",fontSize:13}}>♡ Pour toujours ♡</span>
        <div style={{flex:1,height:1,background:"linear-gradient(to left,transparent,#0f2a4a)"}}/>
      </footer>
    </div>
  );
}

// ─── Capsule Temporelle ───────────────────────────────────────────────────────
function CapsuleCard({msg, user}) {
  // Parse "YYYY-MM-DD" as LOCAL midnight to avoid UTC offset issues
  const parseLocalDate = (str) => {
    if (!str) return new Date(0);
    // "YYYY-MM-DD" → local time
    if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
      const [y,mo,d] = str.split("-").map(Number);
      return new Date(y, mo-1, d, 0, 0, 0, 0);
    }
    return new Date(str);
  };

  const unlockTs = parseLocalDate(msg.unlockDate).getTime();

  // Reactive: re-check every second so blur disappears the moment date is reached
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    if (now >= unlockTs) return; // already unlocked, no need for interval
    const id = setInterval(() => {
      const n = Date.now();
      setNow(n);
      if (n >= unlockTs) clearInterval(id);
    }, 1000);
    return () => clearInterval(id);
  }, [unlockTs]);

  const unlocked = now >= unlockTs;
  const authorLabel = msg.author === "lui" ? "Lui 💙" : "Elle 🌸";
  const fmt = (ts) => new Date(ts).toLocaleDateString("fr-FR", {day:"numeric",month:"long",year:"numeric"});

  // Countdown values
  const diffMs = Math.max(0, unlockTs - now);
  const cntD = Math.floor(diffMs/86400000);
  const cntH = Math.floor(diffMs/3600000)%24;
  const cntM = Math.floor(diffMs/60000)%60;
  const cntS = Math.floor(diffMs/1000)%60;

  return (
    <div style={{background:"rgba(13,27,42,.8)",border:`1px solid ${unlocked?"rgba(96,165,250,.35)":"rgba(30,58,95,.5)"}`,borderRadius:12,padding:"24px",position:"relative",transition:"border-color .6s"}}>
      <div className="corner-bracket tl"/><div className="corner-bracket br"/>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:20}}>{unlocked ? "💌" : "🔒"}</span>
          <div>
            <div style={{fontFamily:"'Outfit',sans-serif",fontSize:10,letterSpacing:2,textTransform:"uppercase",color:msg.author==="lui"?"#3b82f6":"#f472b6",marginBottom:2}}>{authorLabel}</div>
            <div style={{fontFamily:"'Outfit',sans-serif",fontSize:10,color:"#334155"}}>
              {unlocked ? `Débloqué le ${fmt(unlockTs)}` : `Se dévoile le ${fmt(unlockTs)}`}
            </div>
          </div>
        </div>
        {unlocked
          ? <span style={{fontFamily:"'Space Mono',monospace",fontSize:10,color:"#22c55e",letterSpacing:1}}>✓ OUVERT</span>
          : <span style={{fontFamily:"'Space Mono',monospace",fontSize:11,color:"#334155",letterSpacing:1}}>
              {cntD > 0 && `${cntD}j `}{String(cntH).padStart(2,"0")}:{String(cntM).padStart(2,"0")}:{String(cntS).padStart(2,"0")}
            </span>
        }
      </div>
      {/* Message body */}
      <div style={{position:"relative",borderRadius:8,overflow:"hidden"}}>
        <p style={{
          fontFamily:"'Cormorant Garamond',serif",
          fontStyle:"italic",
          fontSize:17,
          lineHeight:1.8,
          color:"#cbd5e1",
          padding:"16px 20px",
          background:"rgba(8,20,35,.6)",
          borderRadius:8,
          border:"1px solid rgba(30,58,95,.3)",
          margin:0,
          filter: unlocked ? "none" : "blur(12px)",
          userSelect: unlocked ? "auto" : "none",
          pointerEvents: unlocked ? "auto" : "none",
          transition:"filter .8s ease",
          minHeight:60,
        }}>{msg.text}</p>
        {!unlocked && (
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",borderRadius:8,pointerEvents:"none"}}>
            <div style={{fontSize:28,marginBottom:4}}>🔒</div>
            <span style={{fontFamily:"'Outfit',sans-serif",fontSize:11,color:"#475569",letterSpacing:2}}>Message scellé</span>
          </div>
        )}
      </div>
    </div>
  );
}

function CapsulePage({user}) {
  const [messages,setMessages]=useState([]);
  const [loading,setLoading]=useState(true);
  const [text,setText]=useState("");
  const [unlockDate,setUnlockDate]=useState("");
  const [sending,setSending]=useState(false);
  const [showForm,setShowForm]=useState(false);
  const [err,setErr]=useState("");

  useEffect(() => {
    setLoading(true);
    let unsub;
    waitForFirebase().then(() => {
      unsub = window.fbOnSnapshotMessages((data) => {
        setMessages(data);
        setLoading(false);
      });
    });
    return () => { if (unsub) unsub(); };
  }, []);

  const minDate = new Date(); minDate.setDate(minDate.getDate()+1);
  const minStr = minDate.toISOString().split("T")[0];

  const sendMessage = async () => {
    if (!text.trim()) { setErr("Écris ton message ♡"); return; }
    if (!unlockDate) { setErr("Choisis une date de dévoilement."); return; }
    setSending(true); setErr("");
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    try {
      await waitForFirebase();
      await fbCall('fbAddMessage', id, text.trim(), unlockDate, user);
      setMessages(prev => [{id, text:text.trim(), unlockDate, author:user, createdAt:Date.now()}, ...prev]);
      setText(""); setUnlockDate(""); setShowForm(false);
    } catch(e) { setErr("Erreur lors de l'envoi : "+e.message); }
    setSending(false);
  };

  // Separate messages: those for you vs those from you
  const forMe = messages.filter(m => m.author !== user);
  const fromMe = messages.filter(m => m.author === user);

  return (
    <div style={{position:"relative",zIndex:1,padding:"60px 24px 100px",maxWidth:720,margin:"0 auto"}}>
      {/* Header */}
      <div className="fade-up" style={{textAlign:"center",marginBottom:48}}>
        <span style={{color:"#1e3a5f",fontFamily:"'Space Mono',monospace",fontSize:11,letterSpacing:4}}>◆ — CAPSULE TEMPORELLE — ◆</span>
        <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"clamp(34px,5vw,56px)",fontWeight:300,color:"#e2e8f0",marginTop:8}}>Messages Cachés</h2>
        <p style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",color:"#475569",fontSize:16,marginTop:8}}>
          Des mots scellés dans le temps, qui se dévoilent au moment choisi.
        </p>
        <div style={{display:"flex",alignItems:"center",gap:12,marginTop:16}}>
          <div style={{flex:1,height:1,background:"linear-gradient(to right,transparent,#1e3a5f)"}}/>
          <span style={{color:"#1e3a5f",fontSize:10}}>♡</span>
          <div style={{flex:1,height:1,background:"linear-gradient(to left,transparent,#1e3a5f)"}}/>
        </div>
      </div>

      {/* Bouton préparer */}
      <div className="fade-up-d1" style={{marginBottom:40}}>
        {!showForm ? (
          <div style={{textAlign:"center"}}>
            <button className="btn-primary" onClick={()=>setShowForm(true)} style={{padding:"14px 32px",fontSize:12,letterSpacing:2}}>
              {user==="lui" ? "🎁 Préparer une surprise" : "💌 Envoyer un message"}
            </button>
          </div>
        ) : (
          <div style={{background:"rgba(13,27,42,.9)",border:"1px solid rgba(59,130,246,.3)",borderRadius:14,padding:"28px",boxShadow:"0 0 40px rgba(59,130,246,.08)"}}>
            <div className="corner-bracket tl"/><div className="corner-bracket br"/>
            <h3 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:22,color:"#e2e8f0",marginBottom:4}}>
              {user==="lui" ? "Une surprise pour elle 💙" : "Un message pour lui 🌸"}
            </h3>
            <p style={{fontFamily:"'Outfit',sans-serif",fontSize:11,color:"#334155",letterSpacing:1,marginBottom:20}}>Le message sera flouté jusqu'à la date choisie.</p>
            <label style={{fontFamily:"'Outfit',sans-serif",fontSize:10,letterSpacing:2,textTransform:"uppercase",color:"#475569",display:"block",marginBottom:8}}>Ton message *</label>
            <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Écris ce que tu veux lui dire…" rows={5} style={{marginBottom:16,resize:"vertical"}}/>
            <label style={{fontFamily:"'Outfit',sans-serif",fontSize:10,letterSpacing:2,textTransform:"uppercase",color:"#475569",display:"block",marginBottom:8}}>Se dévoile le *</label>
            <input type="date" value={unlockDate} min={minStr} onChange={e=>setUnlockDate(e.target.value)} style={{marginBottom:16,width:"auto"}}/>
            {err&&<p style={{color:"#f87171",fontSize:12,marginBottom:12,fontFamily:"'Outfit',sans-serif"}}>{err}</p>}
            <div style={{display:"flex",gap:10}}>
              <button className="btn-primary" onClick={sendMessage} disabled={sending}>{sending?"Envoi…":"Sceller le message 🔒"}</button>
              <button className="btn-ghost" onClick={()=>{setShowForm(false);setText("");setUnlockDate("");setErr("");}}>Annuler</button>
            </div>
          </div>
        )}
      </div>

      {/* Messages reçus */}
      {loading && <div style={{textAlign:"center",padding:"48px 0"}}><div style={{width:32,height:32,border:"2px solid #1e3a5f",borderTopColor:"#3b82f6",borderRadius:"50%",margin:"0 auto",animation:"spin .8s linear infinite"}}/></div>}
      {!loading && (
        <>
          {forMe.length > 0 && (
            <div style={{marginBottom:40}}>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
                <div style={{flex:1,height:1,background:"linear-gradient(to right,transparent,#1e3a5f)"}}/>
                <span style={{fontFamily:"'Outfit',sans-serif",fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"#334155"}}>Messages pour toi</span>
                <div style={{flex:1,height:1,background:"linear-gradient(to left,transparent,#1e3a5f)"}}/>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:16}}>
                {forMe.map(m=><CapsuleCard key={m.id} msg={m} user={user}/>)}
              </div>
            </div>
          )}
          {fromMe.length > 0 && (
            <div>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
                <div style={{flex:1,height:1,background:"linear-gradient(to right,transparent,#1e3a5f)"}}/>
                <span style={{fontFamily:"'Outfit',sans-serif",fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"#334155"}}>Tes messages envoyés</span>
                <div style={{flex:1,height:1,background:"linear-gradient(to left,transparent,#1e3a5f)"}}/>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:16}}>
                {fromMe.map(m=><CapsuleCard key={m.id} msg={m} user={user}/>)}
              </div>
            </div>
          )}
          {messages.length===0 && (
            <div style={{textAlign:"center",padding:"80px 0"}}>
              <div style={{fontSize:52,marginBottom:16,opacity:.3}}>🔒</div>
              <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:22,color:"#334155",fontStyle:"italic"}}>La capsule est vide pour l'instant…</p>
              <p style={{fontFamily:"'Outfit',sans-serif",fontSize:12,color:"#1e3a5f",marginTop:8,letterSpacing:2}}>Sois le premier à sceller un message ♡</p>
            </div>
          )}
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
// Attend que Firebase soit init, puis transforme manuellement le script JSX
(function() {
  function runBabel() {
    if (typeof Babel === "undefined" || typeof firebase === "undefined") {
      return setTimeout(runBabel, 30);
    }
    // S'assurer que Firebase est bien init
    if (!window.fbGetHearts) {
      return setTimeout(runBabel, 30);
    }
    // Transformer le script JSX en JS et l'exécuter
    var pending = document.getElementById("main-babel-script");
    if (!pending) return;
    try {
      var src = pending.textContent || pending.innerHTML;
      var transformed = Babel.transform(src, { presets: ["react"] }).code;
      var s = document.createElement("script");
      s.textContent = transformed;
      document.body.appendChild(s);
    } catch(e) {
      console.error("Babel transform error:", e);
    }
  }
  runBabel();
})();
</script>
</body>
