          img.onload = function() {
            var maxW=800, w=img.width, h=img.height;
            if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
            var c=document.createElement("canvas"); c.width=w; c.height=h;
            c.getContext("2d").drawImage(img,0,0,w,h);
            var compressed = c.toDataURL("image/jpeg",0.75);
            _db.collection("photos").doc(id).set({url:compressed,caption:caption,date:date,createdAt:Date.now()})

      window.fbInitMessaging = function(userLabel, onStatus) {
        var cb = onStatus || function(){};
        if (!("serviceWorker" in navigator)) { cb("NON_SUPPORTE"); return; }
        cb("PERMISSION");
        return Notification.requestPermission()
          .then(function(permission) {
            if (permission !== "granted") { cb("REFUSE"); return; }
            cb("SW");
            return navigator.serviceWorker.register("./firebase-messaging-sw.js");
          })
          .then(function(swReg) {
            if (!swReg) return;
            cb("TOKEN");
            var messaging = firebase.messaging();

              serviceWorkerRegistration: swReg
            });
          })
          .then(function(token) {
            if (!token) { cb("PAS_DE_TOKEN"); return; }
            cb("SAVE");
            return _db.collection("fcm_tokens").doc(token).set({
              token: token,
              user: userLabel,
              createdAt: Date.now()
            }).then(function() { cb("OK"); });
          })
          .catch(function(err) { cb("ERREUR:" + (err.message || String(err))); });
      };

      // ── Cooldown cœurs (1h par personne) ────────────────────────────────────
      window.fbGetHeartCooldown = function(user) {

          to: to, type: type, title: title, body: body,
          sent: false, createdAt: Date.now()
        });
      };

      window.fbIncrementHeart = function(field) {
        var ref = _db.collection("counters").doc("global_hearts");
        return ref.get().then(function(snap) {
          var p = snap.exists ? Promise.resolve() : ref.set({count_boeuf:0,count_poulet:0});
          return p.then(function() {
            var upd = {}; upd[field] = firebase.firestore.FieldValue.increment(1);
            return ref.update(upd);
          }).then(function() { return ref.get(); }).then(function(s){ return s.data(); });
        });
      };

      // ── États d'humeur ─────────────────────────────────────────────────────
      // Sauvegarde l'état du jour pour un utilisateur
      window.fbSetEtat = function(user, humeur, energie) {
        var today = new Date().toISOString().split("T")[0];
        var id = user + "_" + today;
        return _db.collection("etats").doc(id).set({
          user: user, humeur: humeur, energie: energie,
          date: today, updatedAt: Date.now()
        }, { merge: true });
      };
      // Écoute temps réel des états des deux utilisateurs
      window.fbOnSnapshotEtats = function(callback) {
        return _db.collection("etats").orderBy("updatedAt", "desc")
          .onSnapshot(function(snap) {
            callback(snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }));
          }, function(err){ console.error("onSnapshot etats:", err); });
      };
      // Récupère les 7 derniers jours d'un utilisateur
      window.fbGetHistoriqueEtat = function(user) {
        var cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - 6);
        var cutoffStr = cutoff.toISOString().split("T")[0];
        return _db.collection("etats")
          .where("user", "==", user)
          .where("date", ">=", cutoffStr)
          .orderBy("date", "desc")
          .get()
          .then(function(s){ return s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); });
      };

      // ── Questions du soir Firebase (partagées) ─────────────────────────────
      window.fbSetQuestionAnswer = function(user, dayKey, answer) {
        var id = "q_" + dayKey + "_" + user;
        return _db.collection("question_answers").doc(id).set({
          user: user, dayKey: dayKey, answer: answer, savedAt: Date.now()
        }, { merge: true });
      };
      window.fbOnSnapshotQuestionAnswers = function(dayKey, callback) {
        return _db.collection("question_answers").where("dayKey", "==", dayKey)

            callback(snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }));

      // ── Besoin du moment ────────────────────────────────────────────────────

          from: from, to: to, text: text, createdAt: Date.now()

      };

      // ── Planifier notif 18h "Comment on va ?" ──────────────────────────────
      window.fbScheduleEveningCheck = function() {
        var now = new Date();
        var target = new Date();
        target.setHours(18, 0, 0, 0);
        if (now >= target) target.setDate(target.getDate() + 1);
        var msUntil = target - now;
        clearTimeout(window._eveningNotifTimeout);
        window._eveningNotifTimeout = setTimeout(function() {
          if (Notification && Notification.permission === "granted") {
            new Notification("Comment on va ? 💙", {
              body: "C'est l'heure du check-in du soir — partage ton état ♡",
              icon: "/icon-192.png",
              badge: "/icon-72.png",
              vibrate: [200, 100, 200],
              tag: "evening-check",
            });
          }
          window.fbScheduleEveningCheck();
        }, msUntil);
      };
    })();

// Firebase est init synchrone dans le <head>.
function waitForFirebase() { return Promise.resolve(); }

// Appel sécurisé : vérifie que la fn existe avant d'appeler
function fbCall(fnName, ...args) {
  if (typeof window[fnName] !== "function") {
    // Firebase CDN n'a pas encore chargé → réessayer dans 200ms, max 10s
    return new Promise(function(resolve, reject) {
      var tries = 0;
      var t = setInterval(function() {
        tries++;
        if (typeof window[fnName] === "function") {
          clearInterval(t);
          resolve(window[fnName](...args));
        } else if (tries > 50) {
          clearInterval(t);
          reject(new Error("Firebase non disponible. Vérifie ta connexion et recharge la page."));
        }
      }, 200);
    });
  }
  return Promise.resolve(window[fnName](...args));
}

function fileToBase64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
}

function getLastVisit(user) {
  try { return localStorage.getItem(`lastVisit_${user}`); } catch { return null; }
}
function saveVisit(user) {
  try { localStorage.setItem(`lastVisit_${user}`, new Date().toISOString()); } catch {}
}
function fmtVisit(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  const now = new Date();
  const diffMs = now - d;
  const diffMin = Math.floor(diffMs / 60000);
  if (diffMin < 2) return "à l'instant";
  if (diffMin < 60) return `il y a ${diffMin} min`;
  const diffH = Math.floor(diffMin / 60);
  if (diffH < 24) return `il y a ${diffH}h`;
  const diffD = Math.floor(diffH / 24);
  return `il y a ${diffD}j`;
}

function useTimer() {
  const [t, setT] = useState({ days:0, hours:0, minutes:0, seconds:0 });
  useEffect(() => {
    const tick = () => {
      const ms = Math.max(0, Date.now() - START_DATE.getTime());
      setT({ days:Math.floor(ms/86400000), hours:Math.floor(ms/3600000)%24, minutes:Math.floor(ms/60000)%60, seconds:Math.floor(ms/1000)%60 });
    };
    tick(); const id = setInterval(tick, 1000); return () => clearInterval(id);
  }, []);
  return t;
}

function getAnniversaries() {
  const end = new Date(); end.setHours(23,59,59,999);
  const list = []; let n = 1;
  while (list.length < 6 && n < 300) {
    const d = new Date(START_DATE); d.setMonth(START_DATE.getMonth()+n);
    if (d > end) list.push({ num:n, date:d }); n++;
  }
  return list;
}
function getProgress(ann) {
  const prev = new Date(START_DATE); prev.setMonth(START_DATE.getMonth()+ann.num-1);
  return +(Math.min(100,Math.max(0,((Date.now()-prev.getTime())/(ann.date.getTime()-prev.getTime()))*100)).toFixed(1));
}

// ─── Compteurs de cœurs ───────────────────────────────────────────────────────
function HeartsBlock({user}) {
  const [counts, setCounts] = useState({count_boeuf:0, count_poulet:0});
  const [loading, setLoading] = useState(true);
  const [bumping, setBumping] = useState(null); // "boeuf"|"poulet"
  const [cooldownMsg, setCooldownMsg] = useState("");

  useEffect(() => {
    let unsub;
    waitForFirebase().then(() => {
      unsub = window.fbOnSnapshotHearts((data) => {
        setCounts(data);
        setLoading(false);
      });
    });
    return () => { if (unsub) unsub(); };
  }, []);

  const handleHeart = async (field) => {
    try {
      await waitForFirebase();
      // Incrément toujours (pas de blocage sur le clic)
      setBumping(field);
      setTimeout(() => setBumping(null), 400);
      const updated = await fbCall('fbIncrementHeart', field);
      setCounts(updated);
      // Cooldown 1h uniquement pour la NOTIF
      const lastClick = await fbCall('fbGetHeartCooldown', user);
      const canNotif = !lastClick || Date.now() - lastClick >= 3600000;
      const other = user === "lui" ? "elle" : "lui";
      const myName = user === "lui" ? "A" : "N";
      if (canNotif) {
        await fbCall('fbSetHeartCooldown', user);
        await fbCall('fbQueueNotif', other, "heart",
          "Un cœur pour toi ♡",
          myName + " vient de t'envoyer un cœur 💙");
        setCooldownMsg("Cœur envoyé + notif ♡");
      } else {
        const remaining = Math.ceil((3600000 - (Date.now() - lastClick)) / 60000);
        setCooldownMsg("Cœur envoyé ♡ (notif dans " + remaining + " min)");
      }
      setTimeout(() => setCooldownMsg(""), 3000);
    } catch(e) { console.error(e); }
  };

  // Determine which side is "mine" vs "theirs" based on user
  const myField    = user === "lui" ? "count_boeuf"  : "count_poulet";
  const theirField = user === "lui" ? "count_poulet" : "count_boeuf";
  const myLabel    = user === "lui" ? "Moi 💙"       : "Moi 🌸";
  const theirLabel = user === "lui" ? "Elle 🌸"      : "Lui 💙";

  const HeartCounter = ({field, label, clickable}) => {
    const count = counts[field] ?? 0;
    const isBumping = bumping === field;
    // Color reflects who OWNS this counter, not who is logged in
    const isBoeuf = field === "count_boeuf";
    const color = isBoeuf ? "#93c5fd" : "#f9a8d4";
    const glow  = isBoeuf ? "rgba(147,197,253,.4)" : "rgba(249,168,212,.4)";
    return (
      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:12,padding:"24px 16px",background:clickable?"rgba(29,78,216,.06)":"rgba(13,27,42,.5)",border:`1px solid ${clickable?"rgba(59,130,246,.3)":"rgba(30,58,95,.4)"}`,borderRadius:12,position:"relative"}}>
        {clickable && <><div className="corner-bracket tl"/><div className="corner-bracket br"/></>}
        <span style={{fontFamily:"'Outfit',sans-serif",fontSize:10,letterSpacing:3,textTransform:"uppercase",color:clickable?color:"#475569"}}>{label}</span>
        <div style={{fontFamily:"'Space Mono',monospace",fontSize:"clamp(40px,8vw,72px)",fontWeight:700,color:clickable?color:"#334155",lineHeight:1,textShadow:clickable?`0 0 30px ${glow}`:"none",transform:isBumping?"scale(1.25)":"scale(1)",transition:"transform .15s cubic-bezier(.34,1.56,.64,1)"}}>{loading?"…":count}</div>
        <button
          onClick={clickable ? ()=>handleHeart(field) : undefined}
          disabled={!clickable || loading}
          style={{fontSize:32,background:"none",border:"none",cursor:clickable?"pointer":"default",opacity:clickable?1:.2,transform:isBumping?"scale(1.5) rotate(-15deg)":"scale(1)",transition:"transform .15s cubic-bezier(.34,1.56,.64,1)",filter:clickable?`drop-shadow(0 0 8px ${glow})`:"none",padding:0,lineHeight:1,color:clickable?color:"#334155"}}
          title={clickable?"Envoyer un cœur ♡":"Compteur de l'autre"}
        >♡</button>
        {!clickable && <span style={{fontFamily:"'Outfit',sans-serif",fontSize:9,letterSpacing:2,color:"#1e3a5f",textTransform:"uppercase"}}>lecture seule</span>}
      </div>
    );
  };

  return (
    <div className="fade-up-d2" style={{marginBottom:48}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        <div style={{flex:1,height:1,background:"linear-gradient(to right,transparent,#1e3a5f)"}}/>
        <span style={{fontFamily:"'Outfit',sans-serif",fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"#334155"}}>Nos Cœurs</span>
        <div style={{flex:1,height:1,background:"linear-gradient(to left,transparent,#1e3a5f)"}}/>
      </div>
      <div style={{display:"flex",gap:12,maxWidth:500,margin:"0 auto",flexWrap:"wrap"}}>
        <HeartCounter field={theirField} label={theirLabel} clickable={false}/>
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,color:"#1e3a5f",flexShrink:0}}>♡</div>
        <HeartCounter field={myField} label={myLabel} clickable={true}/>
      </div>
      {cooldownMsg && (
        <p style={{textAlign:"center",marginTop:10,fontFamily:"'Outfit',sans-serif",fontSize:11,letterSpacing:1,color:"#f9a8d4"}}>
          {cooldownMsg}
        </p>
      )}
      {!cooldownMsg && (
        <p style={{textAlign:"center",marginTop:12,fontFamily:"'Outfit',sans-serif",fontSize:10,letterSpacing:2,color:"#1e3a5f"}}>
          ✦ Clique sur ton cœur pour en envoyer un ✦
        </p>
      )}
    </div>
  );
}

// ─── Aperçu capsules sur HomePage ────────────────────────────────────────────
function parseLocalDate(str) {
  if (!str) return new Date(0);
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
    const [y,mo,d] = str.split("-").map(Number);
    return new Date(y, mo-1, d, 0, 0, 0, 0);
  }
  return new Date(str);
}

function HomeCapsulesBlock({user}) {
  const [messages, setMessages] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    let unsub;
    waitForFirebase().then(() => {
      unsub = window.fbOnSnapshotMessages((data) => {
        setMessages(data);
        setLoading(false);
      });
    });
    return () => { if (unsub) unsub(); };
  }, []);

  // Show only messages addressed TO the current user (sent by the other),
  // AND not yet in "Mémoire" (i.e. unlocked since less than 7 days, or still locked)
  const SEPT_JOURS_MS = 7 * 24 * 60 * 60 * 1000;
  const forMe = messages.filter(m => {
    if (m.author === user) return false; // pas les miens
    const unlockTs = parseLocalDate(m.unlockDate).getTime();
    const estEnMemoire = Date.now() >= unlockTs && (Date.now() - unlockTs) > SEPT_JOURS_MS;
    return !estEnMemoire;
  });
  if (!loading && forMe.length === 0) return null;

  return (
    <div className="fade-up-d3" style={{marginBottom:48}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        <div style={{flex:1,height:1,background:"linear-gradient(to right,transparent,#1e3a5f)"}}/>
        <span style={{fontFamily:"'Outfit',sans-serif",fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"#334155"}}>Messages Secrets</span>
        <div style={{flex:1,height:1,background:"linear-gradient(to left,transparent,#1e3a5f)"}}/>
      </div>
      {loading && (
        <div style={{textAlign:"center",padding:"32px 0"}}><div style={{width:24,height:24,border:"2px solid #1e3a5f",borderTopColor:"#3b82f6",borderRadius:"50%",margin:"0 auto",animation:"spin .8s linear infinite"}}/></div>
      )}
      {!loading && (
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {forMe.map(msg => <HomeCapsuleCard key={msg.id} msg={msg}/>)}
        </div>
      )}
    </div>
  );
}

function HomeCapsuleCard({msg}) {
  const unlockTs = parseLocalDate(msg.unlockDate).getTime();
  const [now, setNow] = useState(Date.now());

  useEffect(() => {
    if (Date.now() >= unlockTs) return;
    const id = setInterval(() => {
      const n = Date.now();
      setNow(n);
      if (n >= unlockTs) clearInterval(id);
    }, 1000);
    return () => clearInterval(id);
  }, [unlockTs]);

  const unlocked = now >= unlockTs;
  const diffMs = Math.max(0, unlockTs - now);
  const cntD = Math.floor(diffMs/86400000);
  const cntH = Math.floor(diffMs/3600000)%24;
  const cntM = Math.floor(diffMs/60000)%60;
  const cntS = Math.floor(diffMs/1000)%60;
  const authorLabel = msg.author === "lui" ? "De Lui 💙" : "D'Elle 🌸";
  const fmt = ts => new Date(ts).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});

  return (
    <div style={{background:"rgba(13,27,42,.8)",border:`1px solid ${unlocked?"rgba(96,165,250,.3)":"rgba(30,58,95,.4)"}`,borderRadius:12,padding:"20px",position:"relative",transition:"border-color .6s"}}>
      <div className="corner-bracket tl"/><div className="corner-bracket br"/>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:18}}>{unlocked?"💌":"🔒"}</span>
          <div>
            <div style={{fontFamily:"'Outfit',sans-serif",fontSize:10,letterSpacing:2,textTransform:"uppercase",color:msg.author==="lui"?"#3b82f6":"#f472b6"}}>{authorLabel}</div>
            <div style={{fontFamily:"'Outfit',sans-serif",fontSize:10,color:"#334155"}}>{unlocked?`Débloqué le ${fmt(unlockTs)}`:`Se dévoile le ${fmt(unlockTs)}`}</div>
          </div>
        </div>
        {unlocked
          ? <span style={{fontFamily:"'Space Mono',monospace",fontSize:10,color:"#22c55e",letterSpacing:1}}>✓ OUVERT</span>
          : <span style={{fontFamily:"'Space Mono',monospace",fontSize:11,color:"#334155",letterSpacing:1}}>
              {cntD>0&&`${cntD}j `}{String(cntH).padStart(2,"0")}:{String(cntM).padStart(2,"0")}:{String(cntS).padStart(2,"0")}
            </span>
        }
      </div>
      <div style={{position:"relative",borderRadius:8,overflow:"hidden"}}>
        <p style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:16,lineHeight:1.8,color:"#cbd5e1",padding:"14px 18px",background:"rgba(8,20,35,.6)",borderRadius:8,border:"1px solid rgba(30,58,95,.3)",margin:0,filter:unlocked?"none":"blur(12px)",userSelect:unlocked?"auto":"none",pointerEvents:unlocked?"auto":"none",transition:"filter .8s ease",minHeight:52}}>{msg.text}</p>
        {!unlocked&&(
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",borderRadius:8,pointerEvents:"none"}}>
            <div style={{fontSize:26,marginBottom:4}}>🔒</div>
            <span style={{fontFamily:"'Outfit',sans-serif",fontSize:11,color:"#475569",letterSpacing:2}}>Message scellé</span>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Flashback (Slot Machine Photo) ──────────────────────────────────────────
function FlashbackBlock() {
  const [photos, setPhotos] = useState([]);
  const [current, setCurrent] = useState(null);
  const [animKey, setAnimKey] = useState(0);
  const [loaded, setLoaded] = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const photosRef = useRef([]);
  const intervalRef = useRef(null);

  const pickRandom = (list) => list[Math.floor(Math.random() * list.length)];

  const showRandom = useCallback(() => {
    const pool = photosRef.current;
    if (!pool.length) return;
    setCurrent(pickRandom(pool));
    setAnimKey(k => k + 1);
  }, []);

  // Random interval between 10 and 15 seconds
  const scheduleNext = useCallback(() => {
    clearInterval(intervalRef.current);
    const delay = 10000 + Math.random() * 5000;
    intervalRef.current = setTimeout(() => {
      showRandom();
      scheduleNext();
    }, delay);
  }, [showRandom]);

  useEffect(() => {
    waitForFirebase().then(async () => {
      try {
        const data = await fbCall('fbGetPhotos');
        photosRef.current = data;
        setPhotos(data);
        setLoaded(true);
        if (data.length) {
          const first = pickRandom(data);
          setCurrent(first);
          setAnimKey(1);
          scheduleNext();
        }
      } catch(e) { setLoaded(true); }
    });
    return () => clearTimeout(intervalRef.current);
  }, [scheduleNext]);

  const handleClick = () => {
    if (current) setLightbox(current);
  };

  if (!loaded) return null;

    <div className="fade-up-d2" style={{marginBottom:48}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>

          <div className="corner-bracket tl"/><div className="corner-bracket tr"/>
          <div className="corner-bracket bl"/><div className="corner-bracket br"/>
          <div style={{fontSize:36,marginBottom:16,opacity:.3}}>🖼️</div>
          <p style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:18,color:"#334155",lineHeight:1.7}}>
            Nos futurs souvenirs s'afficheront ici... ♡

      )}
    </div>
  );
}

function AlbumPage({isAdmin}) {
  const [photos,setPhotos]=useState([]);
  const [loading,setLoading]=useState(true);
  const [uploading,setUploading]=useState(false);
  const [lightbox,setLightbox]=useState(null);
  const [caption,setCaption]=useState("");
  const [error,setError]=useState("");
  const [showForm,setShowForm]=useState(false);
  const [pendingFile,setPendingFile]=useState(null);
  const [uploadProgress,setUploadProgress]=useState("");
  const fileRef=useRef();

  const loadPhotos=useCallback(async()=>{
    setLoading(true);
    setError("");
    try{
      await waitForFirebase();
      const data=await fbCall('fbGetPhotos');
      setPhotos(data);
    } catch(e){
      console.error("Photos Firebase error:",e);
      setError("Impossible de charger les photos : "+(e.message||"erreur réseau"));
    }
    setLoading(false);
  },[]);
  useEffect(()=>{loadPhotos();},[loadPhotos]);

  const handleFileSelect=(e)=>{
    const file=e.target.files?.[0];
    if(!file)return;
    if(!file.type.startsWith("image/")){setError("Veuillez sélectionner une image.");return;}
    setPendingFile(file);setShowForm(true);setError("");
  };

  const handleUpload=async()=>{
    if(!pendingFile)return;
    setUploading(true);setError("");setUploadProgress("Préparation…");
    try{
      await waitForFirebase();
      setUploadProgress("Lecture du fichier…");
      const base64=await fileToBase64(pendingFile);
      const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      setUploadProgress("Envoi vers Firebase…");
      const date=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
      const url=await fbCall('fbUploadPhoto', id,base64,caption.trim(),date);
      setPhotos(prev=>[{id,url,caption:caption.trim(),date},...prev]);
      setCaption("");setPendingFile(null);setShowForm(false);
    }catch(e){setError("Erreur : "+(e.message||"image trop lourde ?"));}
    setUploading(false);setUploadProgress("");
    if(fileRef.current)fileRef.current.value="";
  };

  const handleDelete=async(photo)=>{
    await waitForFirebase();
    await fbCall('fbDeletePhoto', photo.id);
    setPhotos(prev=>prev.filter(p=>p.id!==photo.id));
  };

  return (
    <div className="page-inner" style={{position:"relative",zIndex:1,padding:"60px 24px 80px",maxWidth:1100,margin:"0 auto"}}>

function NotifButton({user}) {
  const [status, setStatus] = React.useState("");
  const [loading, setLoading] = React.useState(false);

  const labels = {
    "": null,
    "PERMISSION": "⏳ Demande permission...",
    "SW": "⏳ Enregistrement...",
    "TOKEN": "⏳ Récupération token...",
    "SAVE": "⏳ Sauvegarde...",
    "OK": "✅ Notifications activées !",
    "REFUSE": "❌ Permission refusée",
    "NON_SUPPORTE": "❌ Non supporté",
    "PAS_DE_TOKEN": "❌ Pas de token",
  };

  const activate = () => {
    if (loading) return;
    setLoading(true);
    setStatus("PERMISSION");
    if (typeof window.fbInitMessaging === "function") {
      window.fbInitMessaging(user, function(s) {
        setStatus(s);
        if (s === "OK" || s.startsWith("ERREUR") || s === "REFUSE" || s === "NON_SUPPORTE" || s === "PAS_DE_TOKEN") {
          setLoading(false);
        }
      });
    }
  };

  const done = status === "OK";
  const err = status.startsWith("ERREUR") || status === "REFUSE" || status === "NON_SUPPORTE" || status === "PAS_DE_TOKEN";
  const msg = labels[status] || (status.startsWith("ERREUR") ? "❌ " + status.replace("ERREUR:", "") : status);

  return (
    <div style={{textAlign:"center", padding:"16px 24px 0"}}>
      {!done && (
        <button
          onClick={activate}
          disabled={loading}
          className="btn-ghost"
          style={{fontSize:12, letterSpacing:1, borderColor: err ? "rgba(239,68,68,.4)" : undefined, color: err ? "#f87171" : undefined}}
        >
          {loading ? msg : "🔔 Activer les notifications"}
        </button>
      )}
      {done && (
        <p style={{fontFamily:"'Outfit',sans-serif", fontSize:12, color:"#22c55e", letterSpacing:1}}>
          ✅ Notifications activées sur cet appareil
        </p>
      )}
      {err && !loading && (
        <p style={{fontFamily:"'Outfit',sans-serif", fontSize:11, color:"#f87171", marginTop:6}}>{msg}</p>
      )}
    </div>
  );
}

// ─── Rappel quotidien 15h ─────────────────────────────────────────────────────
function useDailyReminder() {
  // Retourne true si on est entre 15h00 et 23h59 ET que la bannière n'a pas été
  // fermée aujourd'hui (clé localStorage : nh_reminder_dismissed_YYYY-MM-DD)
  const todayKey = () => "nh_reminder_dismissed_" + new Date().toISOString().split("T")[0];
  const [visible, setVisible] = useState(() => {
    const h = new Date().getHours();
    if (h < 15) return false;
    try { return !localStorage.getItem(todayKey()); } catch { return true; }
  });

  // Recheck toutes les minutes (pour que ça s'allume à 15h00 si l'app est ouverte)
  useEffect(() => {
    const id = setInterval(() => {
      const h = new Date().getHours();
      if (h < 15) { setVisible(false); return; }
      try { setVisible(!localStorage.getItem(todayKey())); } catch { setVisible(true); }
    }, 60000);
    return () => clearInterval(id);
  }, []);

  const dismiss = () => {
    try { localStorage.setItem(todayKey(), "1"); } catch {}
    setVisible(false);
  };

  return { visible, dismiss };
}

function JeuQuestionsBlock({user}) {
  const today = new Date().toISOString().split("T")[0];
  const TODAY_KEY = "nh_question_" + today;
  const dayIdx = Math.floor(Date.now() / 86400000);
  const dailyQ = QUESTIONS_COUPLE[dayIdx % QUESTIONS_COUPLE.length];

  const [answer, setAnswer] = React.useState("");
  const [saved, setSaved] = React.useState(false);
  const [theirAnswer, setTheirAnswer] = React.useState(null);
  const [revealed, setRevealed] = React.useState(false);
  const [saving, setSaving] = React.useState(false);
  const [loadingAnswers, setLoadingAnswers] = React.useState(true);

  // Load answers from Firebase in real-time
  React.useEffect(() => {
    let unsub;
    waitForFirebase().then(() => {
      unsub = window.fbOnSnapshotQuestionAnswers(TODAY_KEY, (docs) => {
        const myDoc = docs.find(d => d.user === user);
        const otherDoc = docs.find(d => d.user !== user);
        if (myDoc) { setAnswer(myDoc.answer); setSaved(true); }
        if (otherDoc) { setTheirAnswer(otherDoc.answer); }
        setLoadingAnswers(false);
      });
    });
    return () => { if (unsub) unsub(); };
  }, [TODAY_KEY, user]);

  const handleSave = async () => {
    if (!answer.trim()) return;
    setSaving(true);
    try {
      await fbCall('fbSetQuestionAnswer', user, TODAY_KEY, answer.trim());
      const other = user === "lui" ? "elle" : "lui";
      await fbCall('fbQueueNotif', other, "question",
        "Question du soir ✦",
        (user==="lui"?"A":"N") + " a répondu à la question du soir — à toi ! 💙"
      );
      setSaved(true);
    } catch(e) { console.error(e); }
    setSaving(false);
  };

  return (
    <div className="fade-up-d2" style={{marginBottom:48}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        <div style={{flex:1,height:1,background:"linear-gradient(to right,transparent,#1e3a5f)"}}/>

        <div style={{flex:1,height:1,background:"linear-gradient(to left,transparent,#1e3a5f)"}}/>
      </div>

      <div style={{background:"linear-gradient(135deg,rgba(29,78,216,.08),rgba(13,27,42,.9))",border:"1px solid rgba(59,130,246,.25)",borderRadius:16,padding:"28px 24px",position:"relative",boxShadow:"0 0 40px rgba(29,78,216,.08)"}}>

// ─── Capsule Temporelle ───────────────────────────────────────────────────────
function CapsuleCard({msg, user}) {
  // Parse "YYYY-MM-DD" as LOCAL midnight to avoid UTC offset issues
  const parseLocalDate = (str) => {
    if (!str) return new Date(0);
    // "YYYY-MM-DD" → local time
    if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
      const [y,mo,d] = str.split("-").map(Number);
      return new Date(y, mo-1, d, 0, 0, 0, 0);
    }
    return new Date(str);
  };

  const unlockTs = parseLocalDate(msg.unlockDate).getTime();

  // Reactive: re-check every second so blur disappears the moment date is reached
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    if (now >= unlockTs) return; // already unlocked, no need for interval
    const id = setInterval(() => {
      const n = Date.now();
      setNow(n);
      if (n >= unlockTs) clearInterval(id);
    }, 1000);
    return () => clearInterval(id);
  }, [unlockTs]);

  const unlocked = now >= unlockTs;
  const authorLabel = msg.author === "lui" ? "Lui 💙" : "Elle 🌸";
  const fmt = (ts) => new Date(ts).toLocaleDateString("fr-FR", {day:"numeric",month:"long",year:"numeric"});

  // Countdown values
  const diffMs = Math.max(0, unlockTs - now);
  const cntD = Math.floor(diffMs/86400000);
  const cntH = Math.floor(diffMs/3600000)%24;
  const cntM = Math.floor(diffMs/60000)%60;
  const cntS = Math.floor(diffMs/1000)%60;

  return (
    <div style={{background:"rgba(13,27,42,.8)",border:`1px solid ${unlocked?"rgba(96,165,250,.35)":"rgba(30,58,95,.5)"}`,borderRadius:12,padding:"24px",position:"relative",transition:"border-color .6s"}}>
      <div className="corner-bracket tl"/><div className="corner-bracket br"/>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:20}}>{unlocked ? "💌" : "🔒"}</span>
          <div>
            <div style={{fontFamily:"'Outfit',sans-serif",fontSize:10,letterSpacing:2,textTransform:"uppercase",color:msg.author==="lui"?"#3b82f6":"#f472b6",marginBottom:2}}>{authorLabel}</div>
            <div style={{fontFamily:"'Outfit',sans-serif",fontSize:10,color:"#334155"}}>
              {unlocked ? `Débloqué le ${fmt(unlockTs)}` : `Se dévoile le ${fmt(unlockTs)}`}
            </div>
          </div>
        </div>
        {unlocked
          ? <span style={{fontFamily:"'Space Mono',monospace",fontSize:10,color:"#22c55e",letterSpacing:1}}>✓ OUVERT</span>
          : <span style={{fontFamily:"'Space Mono',monospace",fontSize:11,color:"#334155",letterSpacing:1}}>
              {cntD > 0 && `${cntD}j `}{String(cntH).padStart(2,"0")}:{String(cntM).padStart(2,"0")}:{String(cntS).padStart(2,"0")}
            </span>
        }
      </div>
      {/* Message body */}
      <div style={{position:"relative",borderRadius:8,overflow:"hidden"}}>
        <p style={{
          fontFamily:"'Cormorant Garamond',serif",
          fontStyle:"italic",
          fontSize:17,
          lineHeight:1.8,
          color:"#cbd5e1",
          padding:"16px 20px",
          background:"rgba(8,20,35,.6)",
          borderRadius:8,
          border:"1px solid rgba(30,58,95,.3)",
          margin:0,
          filter: unlocked ? "none" : "blur(12px)",
          userSelect: unlocked ? "auto" : "none",
          pointerEvents: unlocked ? "auto" : "none",
          transition:"filter .8s ease",
          minHeight:60,
        }}>{msg.text}</p>
        {!unlocked && (
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",borderRadius:8,pointerEvents:"none"}}>
            <div style={{fontSize:28,marginBottom:4}}>🔒</div>
            <span style={{fontFamily:"'Outfit',sans-serif",fontSize:11,color:"#475569",letterSpacing:2}}>Message scellé</span>
          </div>
        )}
      </div>

      {/* Photo attachée — visible seulement si déverrouillé */}
      {unlocked && msg.photoUrl && (
        <div style={{marginTop:14,borderRadius:8,overflow:"hidden",border:"1px solid rgba(59,130,246,.18)"}}>
          <img
            src={msg.photoUrl}
            alt={msg.photoCaption||"souvenir"}
            style={{width:"100%",maxHeight:280,objectFit:"cover",display:"block"}}
          />
          {msg.photoCaption && (
            <div style={{padding:"10px 14px",background:"rgba(8,20,35,.7)"}}>
              <p style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:14,color:"#94a3b8",margin:0,lineHeight:1.5}}>{msg.photoCaption}</p>
            </div>
          )}
        </div>
      )}

// ─── Baromètre Duo (graphique 7j à 2 courbes) ─────────────────────────────────
function BarometreDuoBlock() {
  const [data, setData] = React.useState([]);
  const [loading, setLoading] = React.useState(true);

  React.useEffect(() => {
    waitForFirebase().then(async () => {
      try {
        const raw = await fbCall('fbGetHistoriqueEtatBoth');
        setData(raw);
      } catch(e) { console.error(e); }
      setLoading(false);
    });
  }, []);

  const HUMEUR_SCORE = {"🤩":5,"🥰":4,"😊":3,"😌":3,"😴":2,"😰":2,"🤒":2,"😔":1,"😩":1,"😡":1};
  const ENERGIE_SCORE = {"🔋":4,"⚡":5,"😐":3,"🥱":2,"💤":1};

  // Build 7 days grid
  const days = Array.from({length:7}, (_,i) => {
    const d = new Date(); d.setDate(d.getDate() - (6-i));
    return d.toISOString().split("T")[0];
  });

  const getScore = (etat) => {
    if (!etat) return null;
    const h = HUMEUR_SCORE[etat.humeur] || 3;
    const e = ENERGIE_SCORE[etat.energie] || 3;
    return Math.round(((h + e) / 2) * 20); // 0-100
  };

  const luiData  = days.map(day => { const e = data.find(d => d.user==="lui"  && d.date===day); return { day, score: getScore(e), etat:e }; });
  const elleData = days.map(day => { const e = data.find(d => d.user==="elle" && d.date===day); return { day, score: getScore(e), etat:e }; });

  const W = 320, H = 140, PAD = 20;
  const chartW = W - PAD*2, chartH = H - PAD*2;

  const toX = (i) => PAD + (i / 6) * chartW;
  const toY = (score) => PAD + chartH - (score / 100) * chartH;

  const pathFor = (dataArr) => {
    const pts = dataArr.map((d,i) => d.score != null ? [toX(i), toY(d.score)] : null).filter(Boolean);
    if (pts.length < 2) return "";
    return pts.map((p,i) => (i===0?"M":"L") + p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  };

  const dayLabels = ["lu","ma","me","je","ve","sa","di"];
  const todayIdx = new Date().getDay(); // 0=dim
  const weekDays = days.map(d => {
    const wd = new Date(d+"T00:00:00").getDay();
    return ["di","lu","ma","me","je","ve","sa"][wd];
  });

  if (loading) return (
    <div style={{textAlign:"center",padding:"32px"}}><div style={{width:24,height:24,border:"2px solid #1e3a5f",borderTopColor:"#3b82f6",borderRadius:"50%",margin:"0 auto",animation:"spin .8s linear infinite"}}/></div>
  );

  const hasData = luiData.some(d=>d.score!=null) || elleData.some(d=>d.score!=null);

  return (
    <div style={{background:"rgba(13,27,42,.6)",border:"1px solid rgba(59,130,246,.2)",borderRadius:14,padding:"24px",marginTop:32,position:"relative"}}>
      <div className="corner-bracket tl"/><div className="corner-bracket br"/>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:20}}>
        <span style={{fontSize:20}}>📊</span>
        <div>
          <div style={{fontFamily:"'Outfit',sans-serif",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:"#3b82f6",marginBottom:2}}>Baromètre de la semaine</div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:18,color:"#e2e8f0"}}>Vos humeurs sur 7 jours</div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:16}}>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:20,height:2,background:"#60a5fa",borderRadius:1}}/>
            <span style={{fontFamily:"'Outfit',sans-serif",fontSize:9,color:"#60a5fa"}}>A 💙</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:20,height:2,background:"#f472b6",borderRadius:1}}/>
            <span style={{fontFamily:"'Outfit',sans-serif",fontSize:9,color:"#f472b6"}}>N 🌸</span>
          </div>
        </div>
      </div>
      {!hasData ? (
        <p style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:15,color:"#334155",textAlign:"center",padding:"20px 0"}}>
          Commencez à partager vos états pour voir votre baromètre ♡
        </p>
      ) : (
        <div style={{overflowX:"auto"}}>
          <svg viewBox={"0 0 " + W + " " + H} style={{width:"100%",maxWidth:W,display:"block",margin:"0 auto"}}>
            {/* Grid lines */}
            {[0,25,50,75,100].map(v => (
              <line key={v} x1={PAD} y1={toY(v)} x2={W-PAD} y2={toY(v)}
                stroke="#1e3a5f" strokeWidth=".5" strokeOpacity=".5"/>
            ))}
            {/* Day labels */}
            {days.map((d,i) => (
              <text key={d} x={toX(i)} y={H-4} textAnchor="middle"
                fontFamily="'Space Mono',monospace" fontSize="8" fill="#334155">
                {weekDays[i]}
              </text>
            ))}
            {/* Score labels */}
            {[0,50,100].map(v => (
              <text key={v} x={PAD-4} y={toY(v)+3} textAnchor="end"
                fontFamily="'Space Mono',monospace" fontSize="7" fill="#334155">{v}</text>
            ))}
            {/* Lui line */}
            {pathFor(luiData) && (
              <path d={pathFor(luiData)} fill="none" stroke="#60a5fa" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"
                style={{filter:"drop-shadow(0 0 4px #60a5fa88)"}}/>
            )}
            {/* Elle line */}
            {pathFor(elleData) && (
              <path d={pathFor(elleData)} fill="none" stroke="#f472b6" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"
                style={{filter:"drop-shadow(0 0 4px #f472b688)"}}/>
            )}
            {/* Dots lui */}
            {luiData.map((d,i) => d.score != null && (
              <g key={"lui"+i}>
                <circle cx={toX(i)} cy={toY(d.score)} r="4" fill="#60a5fa" opacity=".9"/>
                <title>{d.etat?.humeur} {d.etat?.energie} — score:{d.score}</title>
              </g>
            ))}
            {/* Dots elle */}
            {elleData.map((d,i) => d.score != null && (
              <g key={"elle"+i}>
                <circle cx={toX(i)} cy={toY(d.score)} r="4" fill="#f472b6" opacity=".9"/>
              </g>
            ))}
          </svg>
        </div>
      )}
    </div>
  );
}

function CapsulePage({user, autoOpenForm, onFormOpened}) {
  const [messages,setMessages]=useState([]);
  const [loading,setLoading]=useState(true);
  const [text,setText]=useState("");
  const [unlockDate,setUnlockDate]=useState("");
  const [sending,setSending]=useState(false);
  const [showForm,setShowForm]=useState(false);
  const [err,setErr]=useState("");
  // Photo attachée au message
  const [photoFile,setPhotoFile]=useState(null);
  const [photoPreview,setPhotoPreview]=useState(null);
  const [photoCaption,setPhotoCaption]=useState("");
  const photoRef=useRef();

  // Auto-ouverture depuis le banner rappel
  useEffect(()=>{
    if(autoOpenForm){ setShowForm(true); if(onFormOpened) onFormOpened(); }
  },[autoOpenForm]);

  useEffect(() => {
    setLoading(true);
    let unsub;
    waitForFirebase().then(() => {
      unsub = window.fbOnSnapshotMessages((data) => {
        setMessages(data);
        setLoading(false);
      });
    });
    return () => { if (unsub) unsub(); };
  }, []);

  const minDate = new Date(); minDate.setDate(minDate.getDate()+1);
  const minStr = minDate.toISOString().split("T")[0];

  const sendMessage = async () => {
    if (!text.trim()) { setErr("Écris ton message ♡"); return; }
    if (!unlockDate) { setErr("Choisis une date de dévoilement."); return; }
    setSending(true); setErr("");
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    try {
      await waitForFirebase();
      // Compression photo si présente
      let compressedUrl = null;
      if (photoFile) {
        compressedUrl = await new Promise((res,rej)=>{
          const r=new FileReader();
          r.onload=()=>{
            const img=new Image();
            img.onload=()=>{
              const maxW=600; let w=img.width,h=img.height;
              if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
              const c=document.createElement("canvas"); c.width=w; c.height=h;
              c.getContext("2d").drawImage(img,0,0,w,h);
              res(c.toDataURL("image/jpeg",0.72));
            };
            img.onerror=rej; img.src=r.result;
          };
          r.onerror=rej; r.readAsDataURL(photoFile);
        });
      }
      await fbCall('fbAddMessage', id, text.trim(), unlockDate, user, compressedUrl, photoCaption.trim()||null);
      setMessages(prev => [{id, text:text.trim(), unlockDate, author:user, createdAt:Date.now(), photoUrl:compressedUrl, photoCaption:photoCaption.trim()||null}, ...prev]);
      const other = user === "lui" ? "elle" : "lui";
      const myName = user === "lui" ? "A" : "N";
      const daysUntil = Math.ceil((new Date(unlockDate) - new Date()) / 86400000);
      const daysTxt = daysUntil <= 1 ? "demain" : "dans " + daysUntil + " jours";
      await fbCall('fbQueueNotif', other, "message_new",
        "Message scellé ✉",
        myName + " t'a scellé un message qui s'ouvre " + daysTxt + " ♡");
      setText(""); setUnlockDate(""); setShowForm(false);
      setPhotoFile(null); setPhotoPreview(null); setPhotoCaption("");
      if(photoRef.current) photoRef.current.value="";
    } catch(e) { setErr("Erreur lors de l'envoi : "+e.message); }
    setSending(false);
  };

        <>

                <div style={{flex:1,height:1,background:"linear-gradient(to right,transparent,#1e3a5f)"}}/>
                <span style={{fontFamily:"'Outfit',sans-serif",fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"#334155"}}>Messages pour toi</span>

          {/* Messages de moi */}
          {fromMe.length > 0 && (
            <div>

                <div style={{flex:1,height:1,background:"linear-gradient(to right,transparent,#1e3a5f)"}}/>
                <span style={{fontFamily:"'Outfit',sans-serif",fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"#334155"}}>Tes messages envoyés</span>

              <p style={{fontFamily:"'Outfit',sans-serif",fontSize:11,color:"#1e3a5f",marginTop:10,letterSpacing:2}}>{emptyPoem.sub}</p>
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ─── Mots Gentils ────────────────────────────────────────────────────────────
// Chacun a ses propres mots gentils de l'autre, stockés en Firebase
function MotsGentilsBlock({user}) {
  const other = user === "lui" ? "elle" : "lui";
  const myColor = user === "lui" ? "#93c5fd" : "#f9a8d4";
  const theirColor = user === "lui" ? "#f9a8d4" : "#93c5fd";

  const [mots, setMots] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [newMot, setNewMot] = React.useState("");
  const [sending, setSending] = React.useState(false);
  const [showForm, setShowForm] = React.useState(false);
  const [currentIdx, setCurrentIdx] = React.useState(0);

  // Mots reçus (from other → to me)
  const reçus = mots.filter(m => m.from === other && m.to === user);
  // Mots envoyés par moi
  const envoyés = mots.filter(m => m.from === user);

  React.useEffect(() => {
    waitForFirebase().then(async () => {
      try {
        const data = await fbCall('fbGetMotsGentils');
        setMots(data);
      } catch(e) {}
      setLoading(false);
    });
  }, []);

  const handleSend = async () => {
    if (!newMot.trim()) return;
    setSending(true);
    try {
      await fbCall('fbAddMotGentil', user, other, newMot.trim());
      // notif
      await fbCall('fbQueueNotif', other, "mot_gentil",
        user === "lui" ? "💙 A t'a laissé un mot doux" : "🌸 N t'a laissé un mot doux",
        newMot.trim().slice(0,60) + (newMot.length > 60 ? "…" : "")
      );
      const data = await fbCall('fbGetMotsGentils');
      setMots(data);
      setNewMot("");
      setShowForm(false);
    } catch(e) { console.error(e); }
    setSending(false);
  };

  const currentMot = reçus[currentIdx];

  return (
    <div style={{marginBottom:56}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
        <div style={{flex:1,height:1,background:"linear-gradient(to right,transparent,#1e3a5f)"}}/>
        <span style={{fontFamily:"'Outfit',sans-serif",fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"#334155"}}>
          {user==="lui"?"Ses Mots pour moi 🌸":"Ses Mots pour moi 💙"}
        </span>
        <div style={{flex:1,height:1,background:"linear-gradient(to left,transparent,#1e3a5f)"}}/>
      </div>

      {loading ? (
        <div style={{textAlign:"center",padding:"32px"}}><div style={{width:24,height:24,border:"2px solid #1e3a5f",borderTopColor:"#3b82f6",borderRadius:"50%",margin:"0 auto",animation:"spin .8s linear infinite"}}/></div>
      ) : reçus.length === 0 ? (
        <div style={{background:"rgba(13,27,42,.4)",border:"1px dashed rgba(30,58,95,.5)",borderRadius:14,padding:"40px 24px",textAlign:"center"}}>
          <div style={{fontSize:40,marginBottom:12,opacity:.3}}>💌</div>
          <p style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:17,color:"#334155",lineHeight:1.7}}>
            {user==="lui"?"N":"A"} n'a pas encore laissé de mot doux pour toi…<br/>
            <span style={{fontSize:14,color:"#1e3a5f"}}>Donne-lui une raison d'en écrire ♡</span>
          </p>
        </div>
      ) : (
        <div style={{position:"relative"}}>
          <div className="fade-up" key={currentIdx} style={{background:"rgba(13,27,42,.85)",border:`1px solid ${theirColor}33`,borderRadius:16,padding:"32px 28px",position:"relative",boxShadow:`0 0 40px ${theirColor}10`,minHeight:140}}>
            <div className="corner-bracket tl"/><div className="corner-bracket br"/>
            <div style={{textAlign:"center",marginBottom:16}}>
              <span style={{fontFamily:"'Outfit',sans-serif",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:theirColor}}>
                {user==="lui"?"Elle 🌸":"Lui 💙"} · {new Date(currentMot.createdAt).toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}
              </span>
            </div>
            <p style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:"clamp(17px,2.8vw,22px)",lineHeight:1.8,color:"#e2e8f0",textAlign:"center",margin:0,textShadow:`0 0 30px ${theirColor}30`}}>
              "{currentMot.text}"
            </p>
          </div>
          {reçus.length > 1 && (
            <div style={{display:"flex",justifyContent:"center",gap:16,marginTop:16,alignItems:"center"}}>
              <button onClick={()=>setCurrentIdx(i=>(i-1+reçus.length)%reçus.length)} style={{background:"none",border:"1px solid rgba(30,58,95,.5)",borderRadius:"50%",width:36,height:36,cursor:"pointer",color:"#475569",fontSize:18}}>‹</button>
              <span style={{fontFamily:"'Space Mono',monospace",fontSize:10,color:"#334155",letterSpacing:1}}>{currentIdx+1} / {reçus.length}</span>
              <button onClick={()=>setCurrentIdx(i=>(i+1)%reçus.length)} style={{background:"none",border:"1px solid rgba(30,58,95,.5)",borderRadius:"50%",width:36,height:36,cursor:"pointer",color:"#475569",fontSize:18}}>›</button>
            </div>
          )}
        </div>
      )}

      {/* Laisser un mot doux pour l'autre */}
      <div style={{marginTop:28,textAlign:"center"}}>
        {!showForm ? (
          <button className="btn-ghost" onClick={()=>setShowForm(true)} style={{fontSize:12,letterSpacing:1}}>
            💌 Laisser un mot doux pour {user==="lui"?"N":"A"}
          </button>
        ) : (
          <div style={{background:"rgba(13,27,42,.8)",border:"1px solid rgba(59,130,246,.2)",borderRadius:12,padding:"20px",textAlign:"left"}}>
            <div className="corner-bracket tl"/><div className="corner-bracket br"/>
            <p style={{fontFamily:"'Outfit',sans-serif",fontSize:10,letterSpacing:2,textTransform:"uppercase",color:myColor,marginBottom:12}}>
              Ton mot doux pour {user==="lui"?"N 🌸":"A 💙"}
            </p>
            <textarea
              value={newMot}
              onChange={e=>setNewMot(e.target.value)}
              placeholder="Écris quelque chose de sincère et beau…"
              rows={3}
              style={{marginBottom:12,resize:"vertical",fontSize:14}}
            />
            <div style={{display:"flex",gap:10}}>
              <button className="btn-primary" onClick={handleSend} disabled={sending||!newMot.trim()} style={{opacity:!newMot.trim()?.5:1}}>
                {sending?"Envoi…":"Envoyer ♡"}
              </button>
              <button className="btn-ghost" onClick={()=>setShowForm(false)}>Annuler</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function MemoirePage({user}) {
  const LOTTO_KEY    = "nh_last_lotto_ts";
  const COOLDOWN_MS  = 0; // Pas de cooldown — peut piocher à toute heure ♡

  const [messages,    setMessages]    = useState([]);
  const [loading,     setLoading]     = useState(true);
  const [souvenir,    setSouvenir]    = useState(() => {
    try { const s = localStorage.getItem("nh_souvenir"); return s ? JSON.parse(s) : null; } catch { return null; }
  });
  const setSouvenirPersist = (val) => {
    setSouvenir(val);
    try { if(val) localStorage.setItem("nh_souvenir", JSON.stringify(val)); else localStorage.removeItem("nh_souvenir"); } catch {}
  };
  const [lastTs,      setLastTs]      = useState(() => {
    try { return parseInt(localStorage.getItem(LOTTO_KEY) || "0", 10) || 0; } catch { return 0; }
  });
  const [countdown,   setCountdown]   = useState("");
  const [canPick,     setCanPick]     = useState(false);
  const [picking,     setPicking]     = useState(false); // bref effet de tirage

  // ── Chargement des messages ─────────────────────────────────────────────────
  useEffect(() => {
    let unsub;
    waitForFirebase().then(() => {
      unsub = window.fbOnSnapshotMessages((data) => {
        setMessages(data);
        setLoading(false);
      });
    });
    return () => { if (unsub) unsub(); };
  }, []);

  // ── Compte-à-rebours + bouton actif/désactivé ──────────────────────────────
  useEffect(() => {
    const tick = () => {
      const elapsed  = Date.now() - lastTs;
      const remaining = COOLDOWN_MS - elapsed;
      if (remaining <= 0) {
        setCanPick(true);
        setCountdown("");
      } else {
        setCanPick(true); // Cooldown désactivé, toujours actif
        const totalSec = Math.ceil(remaining / 1000);
        const d = Math.floor(totalSec / 86400);
        const h = Math.floor((totalSec % 86400) / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        let label = "Prochaine pioche dans ";
        if (d > 0) label += `${d}j `;
        label += `${String(h).padStart(2,"0")}h ${String(m).padStart(2,"0")}m`;
        if (d === 0) label += ` ${String(s).padStart(2,"0")}s`;
        setCountdown(label);
      }
    };
    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }, [lastTs]);

  // ── Tirage au sort ──────────────────────────────────────────────────────────
  const piocher = () => {
    if (!canPick || picking) return;
    // Messages > 7 jours déverrouillés
    const SEPT_J = 7 * 24 * 60 * 60 * 1000;
    const pool = messages.filter(m => {
      const ts = parseLocalDate(m.unlockDate).getTime();
      return ts <= Date.now() && (Date.now() - ts) > SEPT_J;
    });
    if (!pool.length) return;

    setPicking(true);
    setTimeout(async () => {
      const picked = pool[Math.floor(Math.random() * pool.length)];
      // Essayer de piocher une photo de l'album pour illustrer
      let albumPhoto = null;
      try {
        const photos = await fbCall('fbGetPhotos');
        if (photos.length) {
          albumPhoto = photos[Math.floor(Math.random() * photos.length)];
        }
      } catch(e) {}
      const ts = Date.now();
      try { localStorage.setItem(LOTTO_KEY, String(ts)); } catch {}
      setLastTs(ts);
      setSouvenirPersist({...picked, _albumPhoto: albumPhoto});
      setPicking(false);
    }, 600);
  };

  const SEPT_J = 7 * 24 * 60 * 60 * 1000;
  const unlockedCount = messages.filter(m => {
    const ts = parseLocalDate(m.unlockDate).getTime();
    return ts <= Date.now() && (Date.now() - ts) > SEPT_J;
  }).length;

  // ── Formatage de date ───────────────────────────────────────────────────────
  const fmtSouvenir = (unlockDate) => {
    const d = parseLocalDate(unlockDate);
    return d.toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"});
  };

  return (
    <div className="page-inner" style={{position:"relative",zIndex:1,padding:"60px 24px 100px",maxWidth:720,margin:"0 auto"}}>

      {/* ── En-tête ── */}
      <div className="fade-up" style={{textAlign:"center",marginBottom:48}}>
        <span style={{color:"#1e3a5f",fontFamily:"'Space Mono',monospace",fontSize:11,letterSpacing:4}}>◆ — MÉMOIRE — ◆</span>
        <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"clamp(34px,5vw,56px)",fontWeight:300,color:"#e2e8f0",marginTop:8}}>
          Loterie de la Nostalgie
        </h2>
        <p style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",color:"#475569",fontSize:16,marginTop:8}}>
          Laisse le hasard raviver un souvenir scellé…
        </p>
        <div style={{display:"flex",alignItems:"center",gap:12,marginTop:16}}>
          <div style={{flex:1,height:1,background:"linear-gradient(to right,transparent,#1e3a5f)"}}/>
          <span style={{color:"#1e3a5f",fontSize:10}}>✨</span>
          <div style={{flex:1,height:1,background:"linear-gradient(to left,transparent,#1e3a5f)"}}/>
        </div>
      </div>

      {/* ── Zone centrale ── */}
      {/* ── Mots Gentils ── */}
      <MotsGentilsBlock user={user}/>

      <div className="fade-up-d1" style={{display:"flex",flexDirection:"column",alignItems:"center",gap:32}}>

        {/* Compteur de souvenirs disponibles */}
        {!loading && (
          <div style={{fontFamily:"'Outfit',sans-serif",fontSize:11,letterSpacing:3,textTransform:"uppercase",color:"#334155",textAlign:"center"}}>
            {unlockedCount === 0
              ? "Aucun souvenir déverrouillé pour l'instant"
              : `${unlockedCount} souvenir${unlockedCount > 1 ? "s" : ""} dans l'urne`
            }
          </div>
        )}

        {/* Bouton principal */}
        <div style={{textAlign:"center"}}>
          <button
            className="btn-primary"
            onClick={piocher}
            disabled={!canPick || picking || loading || unlockedCount === 0}
            style={{
              padding:"16px 40px",
              fontSize:13,
              letterSpacing:2,
              position:"relative",
              overflow:"hidden",
              transition:"all .3s",
              opacity: (!canPick || unlockedCount === 0) ? .55 : 1,
            }}
          >
            {picking ? "Tirage en cours…" : "✨ Piocher un souvenir"}
          </button>

          {!canPick && !picking && (
            <p style={{marginTop:12,fontFamily:"'Space Mono',monospace",fontSize:11,color:"#334155",letterSpacing:1}}>
              {countdown}
            </p>
          )}
          {canPick && !picking && !souvenir && (
            <p style={{marginTop:10,fontFamily:"'Outfit',sans-serif",fontSize:11,color:"#1e3a5f",letterSpacing:2}}>
              ✦ Le hasard choisit pour vous ✦
            </p>
          )}
        </div>

        {/* ── Carte du souvenir pioché ── */}
        {souvenir ? (
          <div
            className="fade-up"
            style={{
              width:"100%",
              background:"rgba(13,27,42,.92)",
              border:"1px solid rgba(96,165,250,.25)",
              borderRadius:16,
              padding:"32px 28px",
              boxShadow:"0 0 60px rgba(59,130,246,.08)",
              position:"relative",
            }}
          >
            <div className="corner-bracket tl"/><div className="corner-bracket br"/>

            {/* Bandeau */}
            <div style={{
              display:"flex",
              alignItems:"center",
              justifyContent:"center",
              gap:8,
              marginBottom:20,
              paddingBottom:16,
              borderBottom:"1px solid rgba(30,58,95,.5)",
            }}>
              <span style={{fontFamily:"'Outfit',sans-serif",fontSize:11,letterSpacing:3,textTransform:"uppercase",color:"#60a5fa"}}>
                ✨ Souvenir scellé ♡
              </span>
            </div>

            {/* Date d'origine */}
            <div style={{
              fontFamily:"'Space Mono',monospace",
              fontSize:11,
              color:"#334155",
              letterSpacing:2,
              textAlign:"center",
              marginBottom:20,
            }}>
              {fmtSouvenir(souvenir.unlockDate)}
            </div>

            {/* Corps du message */}
            <p style={{
              fontFamily:"'Cormorant Garamond',serif",
              fontStyle:"italic",
              fontSize:"clamp(17px,2.5vw,22px)",
              lineHeight:1.85,
              color:"#cbd5e1",
              textAlign:"center",
              whiteSpace:"pre-wrap",
              margin:0,
              padding:"0 8px",
            }}>
              {souvenir.text}
            </p>

            {/* Photo souvenir si présente */}
            {souvenir.photoUrl && (
              <div style={{marginTop:20,borderRadius:10,overflow:"hidden",border:"1px solid rgba(59,130,246,.2)"}}>
                <img src={souvenir.photoUrl} alt={souvenir.photoCaption||"souvenir"} style={{width:"100%",maxHeight:260,objectFit:"cover",display:"block"}}/>
                {souvenir.photoCaption && (
                  <div style={{padding:"10px 16px",background:"rgba(8,20,35,.8)"}}>
                    <p style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:14,color:"#94a3b8",margin:0,lineHeight:1.5,textAlign:"center"}}>{souvenir.photoCaption}</p>
                  </div>
                )}
              </div>
            )}

            {/* Photo aléatoire de l'album */}
            {souvenir._albumPhoto && (
              <div style={{marginTop:16,borderRadius:10,overflow:"hidden",border:"1px solid rgba(96,165,250,.15)",position:"relative"}}>
                <img src={souvenir._albumPhoto.url} alt={souvenir._albumPhoto.caption||"album"} style={{width:"100%",maxHeight:220,objectFit:"cover",display:"block",filter:"brightness(.85)"}}/>
                <div style={{position:"absolute",inset:0,background:"linear-gradient(to top,rgba(2,12,27,.85) 0%,transparent 50%)",pointerEvents:"none"}}/>
                <div style={{position:"absolute",bottom:0,left:0,right:0,padding:"12px 16px"}}>
                  <div style={{fontFamily:"'Outfit',sans-serif",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:"#60a5fa",marginBottom:4}}>✦ Un moment de vous deux ✦</div>
                  {souvenir._albumPhoto.caption && <p style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:13,color:"#e2e8f0",margin:0,lineHeight:1.5}}>{souvenir._albumPhoto.caption}</p>}
                  {souvenir._albumPhoto.date && <p style={{fontFamily:"'Space Mono',monospace",fontSize:9,color:"#475569",margin:"4px 0 0",letterSpacing:1}}>{souvenir._albumPhoto.date}</p>}
                </div>
              </div>
            )}

            {/* Auteur */}
            <div style={{
              marginTop:20,
              paddingTop:16,
              borderTop:"1px solid rgba(30,58,95,.5)",
              textAlign:"right",
            }}>
              <span style={{
                fontFamily:"'Cormorant Garamond',serif",
                fontStyle:"italic",
                fontSize:14,
                color: souvenir.author==="lui" ? "#3b82f6" : "#f472b6",
              }}>
                — {souvenir.author==="lui" ? "Lui 💙" : "Elle 🌸"}
              </span>
            </div>
          </div>
        ) : (
          /* État vide / premier tirage */
          !loading && (
            <div style={{
              width:"100%",
              background:"rgba(13,27,42,.5)",
              border:"1px dashed rgba(30,58,95,.6)",
              borderRadius:16,
              padding:"60px 28px",
              textAlign:"center",
            }}>
              <div style={{fontSize:48,marginBottom:16,opacity:.25}}>✨</div>
              <p style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:18,color:"#334155",lineHeight:1.7}}>
                Votre souvenir pioché apparaîtra ici…
              </p>
              <p style={{fontFamily:"'Outfit',sans-serif",fontSize:11,color:"#1e3a5f",letterSpacing:2,marginTop:10}}>
                Un tirage toutes les 72 heures ♡
              </p>
            </div>
          )
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
// Attend que Firebase soit init, puis transforme manuellement le script JSX
(function() {
  function runBabel() {
    if (typeof Babel === "undefined" || typeof firebase === "undefined") {
      return setTimeout(runBabel, 30);
    }
    // S'assurer que Firebase est bien init
    if (!window.fbGetHearts) {
      return setTimeout(runBabel, 30);
    }
    // Transformer le script JSX en JS et l'exécuter
    var pending = document.getElementById("main-babel-script");
    if (!pending) return;
    try {
      var src = pending.textContent || pending.innerHTML;
      var transformed = Babel.transform(src, { presets: ["react"] }).code;
      var s = document.createElement("script");
      s.textContent = transformed;
      document.body.appendChild(s);
    } catch(e) {
      console.error("Babel transform error:", e);
    }
  }
  runBabel();
})();
</script>
</body>
</html>
